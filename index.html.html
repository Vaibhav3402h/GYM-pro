<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymPro – Gym Management SaaS</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@keyframes fl{0%,100%{background:#7f1d1d}50%{background:#dc2626}}.flash{animation:fl .7s infinite}
@media print{body *{visibility:hidden}#rc,#rc *{visibility:visible}#rc{position:fixed;inset:0;background:#fff;color:#000}}
input,select{background:#171717;border:1px solid #404040;border-radius:8px;padding:10px;width:100%;color:#fff}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid #f97316;outline-offset:2px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState}=React,h=htm.bind(React.createElement);
const T=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const P=s=>{const[a,b,c]=s.split('-');return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return ymd(d)};
const addM=(s,n)=>{const d=P(s);return ymd(new Date(d.getFullYear(),d.getMonth()+Number(n),d.getDate()))};
const dl=s=>Math.round((P(s)-T())/864e5);
const fd=s=>P(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const ru=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const wa=(p,t)=>'https://wa.me/91'+String(p).replace(/\D/g,'').slice(-10)+'?text='+encodeURIComponent(t);
const td=ymd(T());
const SUPPORT='919999900000'; /* apna WhatsApp number yahan likhein (91 ke saath) */
const use=(k,d)=>{const[v,s]=useState(()=>{try{const x=localStorage.getItem('gp_'+k);return x?JSON.parse(x):d}catch(e){return d}});const set=f=>s(p=>{const n=typeof f==='function'?f(p):f;try{localStorage.setItem('gp_'+k,JSON.stringify(n))}catch(e){}return n});return[v,set]};
const Landing=({onDemo})=>{const cta=wa(SUPPORT,'Namaste, mujhe apne gym ke liye GymPro ka 7 din free trial chahiye.');
 const F=[['💬','WhatsApp reminder','Ek click mein fees aur expiry ka message, member ke naam ke saath.'],['🚪','Gate par rokein','ID daalte hi dikhta hai: Access Granted ya Denied.'],['🧾','Digital receipt','Fees lete hi receipt banayein aur WhatsApp par bhejein.'],['📝','Walk-in leads','Jo rates puchhne aaye, unka follow-up kabhi miss na ho.'],['📊','Roz ka hisaab','Kitne member active, kitni fees baaki, kaun expire hone wala hai.'],['📈','Body progress','Weight aur BMI ka record, member ka motivation.']];
 const Pl=[['Basic','₹499',['Members aur fees ka record','WhatsApp fee reminder','Digital receipt'],false],['Pro','₹999',['Basic ka sab kuch','Gate QR check-in','Walk-in leads aur follow-up','Body progress aur BMI','Priority WhatsApp support'],true]];
 return h`<div className="max-w-4xl mx-auto px-4 pb-16">
 <div className="flex justify-between items-center py-4"><div className="font-extrabold text-xl text-orange-500">GymPro</div><a className="text-sm underline" target="_blank" rel="noopener" href=${cta}>Free trial</a></div>
 <section className="py-10 sm:py-16"><h1 className="text-4xl sm:text-6xl font-extrabold leading-tight">Fees ka hisaab apne aap.<br/>Gym hamesha bhara hua.</h1>
 <p className="mt-4 text-lg text-neutral-300 max-w-xl">Kaun si membership kab expire ho rahi hai, kiski fees baaki hai, aur kisko WhatsApp bhejna hai. Sab ek app mein, Hindi aur English mein, seedha mobile par.</p>
 <div className="flex gap-3 mt-6 flex-wrap"><button onClick=${onDemo} className="bg-orange-600 px-5 py-3 rounded-xl font-bold text-lg">Live demo dekhein</button><a className="bg-green-600 px-5 py-3 rounded-xl font-bold text-lg" target="_blank" rel="noopener" href=${cta}>WhatsApp par 7 din free trial</a></div>
 <p className="mt-3 text-sm text-neutral-400">Demo mein aap sab kuch khud try kar sakte hain. Koi signup nahi.</p></section>
 <section className="grid sm:grid-cols-3 gap-3">${F.map(([i,t,d])=>h`<div key=${t} className="bg-neutral-900 border border-neutral-800 rounded-xl p-4"><div className="text-3xl">${i}</div><div className="font-bold mt-1">${t}</div><p className="text-sm text-neutral-400 mt-1">${d}</p></div>`)}</section>
 <section className="mt-12"><h2 className="text-2xl font-extrabold mb-3">Seedha aur saaf price</h2><div className="grid sm:grid-cols-2 gap-3">${Pl.map(([n,p,fs,hi])=>h`<div key=${n} className=${'rounded-2xl p-5 border-2 '+(hi?'border-orange-500 bg-neutral-900':'border-neutral-800 bg-neutral-900')}><div className="font-bold">${n}</div><div className="text-4xl font-extrabold my-1">${p}<span className="text-base font-medium text-neutral-400"> / mahina</span></div><ul className="text-sm space-y-1 mt-2">${fs.map(x=>h`<li key=${x}>✓ ${x}</li>`)}</ul></div>`)}</div><p className="text-sm text-neutral-400 mt-2">UPI se payment. Pehle 7 din free.</p></section>
 <section className="mt-12 bg-neutral-900 border border-neutral-800 rounded-2xl p-5"><h2 className="text-2xl font-extrabold mb-2">Shuru karna aasaan hai</h2><p className="text-neutral-300">Hume WhatsApp par gym ka naam bhejein. Hum aapka account bana denge, aap members add karenge, aur usi din se reminder bhejna shuru.</p><a className="inline-block mt-4 bg-orange-600 px-5 py-3 rounded-xl font-bold" target="_blank" rel="noopener" href=${cta}>Abhi WhatsApp karein</a></section>
 </div>`};

/* ---- Mock data (replace with Supabase queries: gyms, members, leads, checkins, progress) ---- */
const G0=[
 {id:1,name:'Prince of Fitness',phone:'9415000001',plan:999,exp:addD(td,3)},
 {id:2,name:'Iron Paradise Gym',phone:'9839000002',plan:499,exp:addD(td,22)},
 {id:3,name:'Fit Nation Lucknow',phone:'9935000003',plan:999,exp:addD(td,-4)},
 {id:4,name:'Muscle Factory',phone:'9450000004',plan:499,exp:addD(td,10),susp:true}];
const raw=[['Rahul Verma','M',3,-20,6000,6000],['Priya Singh','F',1,-28,1500,1500],['Amit Yadav','M',6,-60,10000,6000],['Sneha Gupta','F',12,-100,15000,15000],['Mohd. Faiz','M',1,-45,1500,1500],['Vikas Mishra','M',3,-5,5000,2000],['Anjali Tiwari','F',1,-25,1500,1000],['Deepak Pandey','M',6,-10,9000,9000]];
const M0=raw.map((r,i)=>({id:'PF'+String(i+1).padStart(3,'0'),gid:1,name:r[0],phone:'98765000'+(11+i),gender:r[1],plan:r[2],start:addD(td,r[3]),total:r[4],paid:r[5]}))
 .concat(raw.slice(0,3).map((r,i)=>({id:'IP'+String(i+1).padStart(3,'0'),gid:2,name:r[0].split(' ')[0]+' Khan',phone:'98390000'+(21+i),gender:r[1],plan:r[2],start:addD(td,r[3]+10),total:r[4],paid:r[5]})));
const L0=[{id:1,gid:1,name:'Karan Saxena',phone:'9005551111',note:'3 mahine plan puchha',fu:addD(td,1)},{id:2,gid:1,name:'Pooja Rastogi',phone:'9005552222',note:'Ladies batch timing',fu:addD(td,-1)}];
const C0=[{mid:'PF001',date:td},{mid:'PF004',date:td},{mid:'PF008',date:td}];
const PR0=[{mid:'PF001',date:addD(td,-60),wt:82,ht:174},{mid:'PF001',date:addD(td,-30),wt:79.5,ht:174},{mid:'PF001',date:td,wt:77,ht:174}];

const end=m=>addM(m.start,m.plan),due=m=>m.total-m.paid;
const st=m=>dl(end(m))<0?'expired':due(m)>0?'due':'ok';
const remind=(m,g)=>`Namaste ${m.name} ji, ${g.name} se message. Aapki ${due(m)>0?'fees ₹'+due(m)+' baaki hai aur ':''}membership ${fd(end(m))} ko ${dl(end(m))<0?'expire ho chuki hai':'expire ho rahi hai'}. Kripya jaldi jama karein. Dhanyavaad!`;

function QR({v,s=120}){let x=0;for(const c of v)x=(x*31+c.charCodeAt(0))>>>0;const r=()=>(x=(x*1664525+1013904223)>>>0)/4294967296;const n=21,cells=[];
 for(let i=0;i<n;i++)for(let j=0;j<n;j++){const f=(a,b)=>(i<7&&j<7&&(a||b))||(i<7&&j>13&&(a||b))||(i>13&&j<7&&(a||b));const k=(i%14)<7&&(j%14)<7&&!(i>6&&j>6)?((i%14)==0||(i%14)==6||(j%14)==0||(j%14)==6||((i%14)>1&&(i%14)<5&&(j%14)>1&&(j%14)<5)):r()>.5;if(k)cells.push(h`<rect key=${i+'-'+j} x=${j} y=${i} width="1" height="1"/>`)}
 return h`<svg viewBox="0 0 21 21" width=${s} height=${s} className="bg-white p-1 rounded" fill="#000">${cells}</svg>`}

const Btn=({c='bg-neutral-800',...p})=>h`<button ...${p} className=${'px-3 py-2 rounded-lg font-semibold text-sm '+c+' '+(p.className||'')}/>`;
const Modal=({title,onClose,children})=>h`<div className="fixed inset-0 bg-black/80 z-50 overflow-y-auto p-3" onClick=${onClose}><div className="max-w-lg mx-auto bg-neutral-900 border border-neutral-700 rounded-2xl p-4 my-4" onClick=${e=>e.stopPropagation()}><div className="flex justify-between items-center mb-3"><h3 className="text-xl font-bold">${title}</h3><button onClick=${onClose} className="text-2xl px-2" aria-label="Close">×</button></div>${children}</div></div>`;
const Badge=({s})=>{const m={ok:['Active','bg-green-900 text-green-300'],due:['Fees baaki','bg-amber-900 text-amber-300'],expired:['Expired','bg-red-900 text-red-300']}[s];return h`<span className=${'px-2 py-0.5 rounded-full text-xs font-semibold '+m[1]}>${m[0]}</span>`};

function Lock({g}){return h`<div className="min-h-[80vh] grid place-items-center p-4"><div className="max-w-sm text-center bg-neutral-900 border border-red-700 rounded-2xl p-6">
 <div className="text-5xl">🔒</div><h2 className="text-2xl font-bold mt-2">${g.name}</h2>
 <p className="mt-3">Your GymPro Software Subscription has expired. Pay <b>₹999/month</b> via UPI to unlock immediately.</p>
 <div className="flex justify-center my-4"><${QR} v="UPI-GYMPRO" s=${150}/></div><p className="text-xs text-neutral-400 mb-3">UPI QR placeholder – apna asli QR yahan lagayein</p>
 <a className="block bg-green-600 rounded-lg py-3 font-bold" target="_blank" rel="noopener" href=${wa(SUPPORT,'Namaste, '+g.name+' ka GymPro subscription renew karna hai.')}>Contact Support on WhatsApp</a></div></div>`}

function Admin({gyms,setGyms}){
 const live=g=>!g.susp&&dl(g.exp)>=0,mrr=gyms.filter(live).reduce((a,g)=>a+g.plan,0);
 const up=(id,f)=>setGyms(gs=>gs.map(g=>g.id===id?f(g):g));
 return h`<div className="p-3 max-w-5xl mx-auto"><div className="grid grid-cols-3 gap-2 mb-4">
  ${[['MRR',ru(mrr)],['Active gyms',gyms.filter(live).length],['Locked',gyms.filter(g=>!live(g)).length]].map(([a,b])=>h`<div key=${a} className="bg-neutral-900 border border-neutral-800 rounded-xl p-3"><div className="text-2xl font-extrabold text-orange-500">${b}</div><div className="text-xs text-neutral-400">${a}</div></div>`)}</div>
  <div className="overflow-x-auto"><table className="w-full text-sm min-w-[720px]"><thead className="text-neutral-400 text-left"><tr>${['Gym','Owner phone','Plan','Expiry','Status',''].map(x=>h`<th key=${x} className="p-2">${x}</th>`)}</tr></thead><tbody>
  ${gyms.map(g=>h`<tr key=${g.id} className="border-t border-neutral-800"><td className="p-2 font-semibold">${g.name}</td><td className="p-2">${g.phone}</td><td className="p-2">₹${g.plan} ${g.plan>500?'Pro':'Basic'}</td><td className="p-2">${fd(g.exp)}</td>
   <td className="p-2">${live(g)?h`<span className="text-green-400">Active</span>`:h`<span className="text-red-400">${g.susp?'Suspended':'Expired'}</span>`}</td>
   <td className="p-2 flex gap-2"><${Btn} c="bg-orange-600" onClick=${()=>up(g.id,x=>({...x,susp:false,exp:addD(dl(x.exp)<0?td:x.exp,30)}))}>Extend +30 Days<//><${Btn} onClick=${()=>up(g.id,x=>({...x,susp:!x.susp}))}>${g.susp?'Unlock':'Suspend'}<//></td></tr>`)}</tbody></table></div></div>`}

function Owner({g,ms,setMs,ls,setLs,cs,setCs,pr,setPr,setTab,tab,modal,setModal}){
 const [flt,setFlt]=useState('all'),[q,setQ]=useState(''),[gid,setGid]=useState(''),[res,setRes]=useState(null),[lead,setLead]=useState(false),[pf,setPf]=useState({wt:'',ht:''});
 const mine=ms.filter(m=>m.gid===g.id);
 const act=mine.filter(m=>dl(end(m))>=0),exp7=mine.filter(m=>dl(end(m))>=0&&dl(end(m))<=7),pend=mine.reduce((a,m)=>a+due(m),0);
 const chk=cs.filter(c=>c.date===td&&mine.some(m=>m.id===c.mid)).length;
 const list=mine.filter(m=>(flt==='all'||(flt==='due'&&due(m)>0)||(flt==='soon'&&dl(end(m))>=0&&dl(end(m))<=7)||(flt==='expired'&&dl(end(m))<0))&&(!q||(m.name+m.id+m.phone).toLowerCase().includes(q.toLowerCase())));
 const bars=[[38,22],[45,25],[41,30],[52,28],[48,31],[60,34]].map(([a,b])=>[a*Math.max(1,mine.length/4)*1000|0,b*Math.max(1,mine.length/4)*1000|0]),mx=Math.max(...bars.map(b=>b[0]));
 const mon=[5,4,3,2,1,0].map(i=>new Date(T().getFullYear(),T().getMonth()-i,1).toLocaleString('en',{month:'short'}));
 const newM=()=>setModal({k:'edit',m:{id:'',gid:g.id,name:'',phone:'',gender:'M',plan:1,start:td,total:'',paid:''}});
 const saveM=m=>{m={...m,total:+m.total||0,paid:+m.paid||0,plan:+m.plan};if(!m.name||String(m.phone).replace(/\D/g,'').length<10){alert('Naam aur 10 digit phone zaroori hai.');return}
  if(m.id)setMs(a=>a.map(x=>x.id===m.id?m:x));else{const p=g.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();m.id=p+String(mine.length+1+Math.floor(Math.random()*90)).padStart(3,'0');setMs(a=>[...a,m])}setModal(null)};
 const gate=()=>{const m=mine.find(x=>x.id.toLowerCase()===gid.trim().toLowerCase());
  if(!m)return setRes({bad:1,t:'Member nahi mila',s:'ID dobara check karein'});
  const s=st(m);if(s==='ok'){setCs(c=>[...c,{mid:m.id,date:td}]);setRes({t:`Welcome ${m.name}! Access Granted.`,s:`Days Left: ${dl(end(m))}`})}
  else setRes({bad:1,t:'ACCESS DENIED!',s:(s==='expired'?'Membership Expired':'Fee Due: '+ru(due(m)))+(s==='expired'&&due(m)?' / Fee Due: '+ru(due(m)):'')})};
 const tabs=[['dash','🏠','Home'],['mem','👥','Members'],['gate','📷','Gate'],['lead','📝','Leads']];
 const sub=dl(g.exp);
 return h`<div className="max-w-3xl mx-auto p-3 pb-24">
 ${sub<=5&&h`<div className="bg-amber-500 text-black rounded-lg p-2 mb-3 text-sm font-semibold">GymPro subscription ${sub===0?'aaj':sub+' din mein'} expire hoga. Lock se bachne ke liye renew karein.</div>`}
 ${tab==='dash'&&h`<div>
  <div className="grid grid-cols-2 gap-2">${[['Active Members',act.length],['Today’s Check-ins',chk],['Pending Fees',ru(pend)],['Expiring in 7 Days',exp7.length]].map(([a,b])=>h`<div key=${a} className="bg-neutral-900 border border-neutral-800 rounded-xl p-3"><div className="text-2xl font-extrabold text-orange-500">${b}</div><div className="text-xs text-neutral-400">${a}</div></div>`)}</div>
  <div className="flex gap-2 my-3 flex-wrap"><${Btn} c="bg-orange-600" onClick=${newM}>+ Add Member<//><${Btn} onClick=${()=>setTab('gate')}>Gate QR Scanner<//><${Btn} onClick=${()=>{setTab('lead');setLead(true)}}>Add Walk-in Inquiry<//></div>
  <div className="bg-neutral-900 border border-neutral-800 rounded-xl p-3"><div className="font-bold mb-2">Revenue vs Expense (6 months)</div><div className="flex items-end gap-2 h-40">${bars.map((b,i)=>h`<div key=${i} className="flex-1 flex flex-col items-center justify-end h-full"><div className="flex items-end gap-1 w-full h-full"><div className="flex-1 bg-orange-500 rounded-t" style=${{height:b[0]/mx*100+'%'}} title=${ru(b[0])}/><div className="flex-1 bg-neutral-500 rounded-t" style=${{height:b[1]/mx*100+'%'}} title=${ru(b[1])}/></div><div className="text-xs text-neutral-400 mt-1">${mon[i]}</div></div>`)}</div><div className="text-xs mt-2 text-neutral-400"><span className="text-orange-500">■</span> Revenue ${ru(bars[5][0])} · ■ Expense ${ru(bars[5][1])} (is mahine, demo data)</div></div></div>`}
 ${tab==='mem'&&h`<div><div className="flex gap-2 mb-2"><input placeholder="Naam / ID / phone" value=${q} onChange=${e=>setQ(e.target.value)}/><${Btn} c="bg-orange-600 whitespace-nowrap" onClick=${newM}>+ Member<//></div>
  <div className="flex gap-2 mb-3 overflow-x-auto">${[['all','Sab'],['due','Fees baaki'],['soon','7 din mein expire'],['expired','Expired']].map(([k,l])=>h`<button key=${k} onClick=${()=>setFlt(k)} className=${'px-3 py-1 rounded-full text-sm whitespace-nowrap '+(flt===k?'bg-orange-600':'bg-neutral-800')}>${l}</button>`)}</div>
  ${list.length?list.map(m=>h`<div key=${m.id} className="bg-neutral-900 border border-neutral-800 rounded-xl p-3 mb-2"><div className="flex justify-between"><div><b>${m.name}</b> <span className="text-xs text-neutral-400">${m.id}</span></div><${Badge} s=${st(m)}/></div>
   <div className="text-sm text-neutral-400">${m.phone} · Expiry ${fd(end(m))}${due(m)>0?' · Due '+ru(due(m)):''}</div>
   <div className="flex gap-2 mt-2 flex-wrap"><a className="bg-green-600 px-3 py-2 rounded-lg text-sm font-semibold" target="_blank" rel="noopener" href=${wa(m.phone,remind(m,g))}>WhatsApp</a><${Btn} onClick=${()=>setModal({k:'rc',m})}>Receipt<//><${Btn} onClick=${()=>setModal({k:'edit',m})}>Edit / Profile<//></div></div>`):h`<p className="text-center text-neutral-400 p-8">Koi member nahi mila.</p>`}</div>`}
 ${tab==='gate'&&h`<div><div className="flex gap-2"><input placeholder="Member ID (jaise PF001)" value=${gid} onChange=${e=>setGid(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&gate()}/><${Btn} c="bg-orange-600" onClick=${gate}>Check<//></div>
  <div className="text-xs text-neutral-400 my-2">Test karein: ${mine.slice(0,6).map(m=>h`<button key=${m.id} className="underline mr-2" onClick=${()=>setGid(m.id)}>${m.id}</button>`)}</div>
  ${res&&h`<div className=${'rounded-2xl p-8 text-center mt-3 '+(res.bad?'flash':'bg-green-700')}><div className="text-5xl">${res.bad?'⛔':'✅'}</div><div className="text-2xl font-extrabold mt-2">${res.t}</div><div className="text-lg mt-1">${res.s}</div></div>`}</div>`}
 ${tab==='lead'&&h`<div><${Btn} c="bg-orange-600 mb-3" onClick=${()=>setLead(!lead)}>+ Walk-in Inquiry<//>
  ${lead&&h`<form className="bg-neutral-900 border border-orange-600 rounded-xl p-3 mb-3 grid gap-2" onSubmit=${e=>{e.preventDefault();const f=new FormData(e.target);setLs(a=>[...a,{id:Date.now(),gid:g.id,name:f.get('n'),phone:f.get('p'),note:f.get('o'),fu:f.get('d')}]);setLead(false)}}><input name="n" placeholder="Naam" required/><input name="p" placeholder="Phone" required/><input name="o" placeholder="Kya puchha (plan/timing)"/><input name="d" type="date" defaultValue=${addD(td,2)} required/><${Btn} c="bg-orange-600" type="submit">Save<//></form>`}
  ${ls.filter(l=>l.gid===g.id).sort((a,b)=>a.fu>b.fu?1:-1).map(l=>h`<div key=${l.id} className="bg-neutral-900 border border-neutral-800 rounded-xl p-3 mb-2"><b>${l.name}</b> <span className="text-sm text-neutral-400">${l.phone}</span><div className="text-sm">${l.note}</div><div className=${'text-sm '+(dl(l.fu)<0?'text-red-400':'text-amber-400')}>Follow-up: ${fd(l.fu)}${dl(l.fu)<0?' (late)':''}</div>
   <div className="flex gap-2 mt-2"><a className="bg-green-600 px-3 py-2 rounded-lg text-sm font-semibold" target="_blank" rel="noopener" href=${wa(l.phone,`Namaste ${l.name} ji, ${g.name} mein aapka swagat hai! Is mahine special offer: 3 mahine ke plan par 10% chhoot. Aaj hi aayein.`)}>WhatsApp Offer</a><${Btn} onClick=${()=>setLs(a=>a.filter(x=>x.id!==l.id))}>Hatayein<//></div></div>`)}</div>`}
 <nav className="fixed bottom-0 inset-x-0 bg-neutral-950 border-t border-neutral-800 grid grid-cols-4" style=${{paddingBottom:'env(safe-area-inset-bottom,0px)'}}>${tabs.map(([k,i,l])=>h`<button key=${k} onClick=${()=>setTab(k)} className=${'py-2 text-xs '+(tab===k?'text-orange-500 font-bold':'text-neutral-400')}><div className="text-xl">${i}</div>${l}</button>`)}</nav>
 ${modal&&modal.k==='edit'&&h`<${MemberForm} m=${modal.m} onSave=${saveM} onClose=${()=>setModal(null)} pr=${pr} setPr=${setPr} pf=${pf} setPf=${setPf}/>`}
 ${modal&&modal.k==='rc'&&h`<${Modal} title="Fee Receipt" onClose=${()=>setModal(null)}><div id="rc" className="bg-white text-black rounded-lg p-4"><div className="text-center font-extrabold text-xl">${g.name}</div><div className="text-center text-sm mb-3">Fee Receipt · ${fd(td)}</div>
  ${[['Member',modal.m.name+' ('+modal.m.id+')'],['Plan',modal.m.plan+' mahina'],['Valid till',fd(end(modal.m))],['Total fee',ru(modal.m.total)],['Amount paid',ru(modal.m.paid)],['Balance due',ru(due(modal.m))]].map(([a,b])=>h`<div key=${a} className="flex justify-between border-b py-1"><span>${a}</span><b>${b}</b></div>`)}<div className="text-center text-xs mt-3">Dhanyavaad!</div></div>
  <div className="flex gap-2 mt-3"><${Btn} c="bg-orange-600" onClick=${()=>{try{window.print()}catch(e){}}}>Print<//><a className="bg-green-600 px-3 py-2 rounded-lg text-sm font-semibold" target="_blank" rel="noopener" href=${wa(modal.m.phone,`${g.name} – Fee Receipt\n${modal.m.name}\nPaid: ${ru(modal.m.paid)}\nBalance: ${ru(due(modal.m))}\nDate: ${fd(td)}`)}>WhatsApp pe bhejein</a></div><//>`}
 </div>`}

function MemberForm({m,onSave,onClose,pr,setPr,pf,setPf}){
 const [f,setF]=useState(m),s=k=>e=>setF({...f,[k]:e.target.value}),mine=pr.filter(p=>p.mid===f.id).sort((a,b)=>a.date>b.date?1:-1);
 const L=(t,c)=>h`<label className="block text-xs text-neutral-400">${t}${c}</label>`;
 return h`<${Modal} title=${f.id?'Edit / Profile':'Naya Member'} onClose=${onClose}><div className="grid grid-cols-2 gap-2">
  <div className="col-span-2">${L('Naam',h`<input value=${f.name} onChange=${s('name')}/>`)}</div>
  ${L('Phone',h`<input inputMode="numeric" maxLength="10" value=${f.phone} onChange=${s('phone')}/>`)}
  ${L('Gender',h`<select value=${f.gender} onChange=${s('gender')}><option value="M">Male</option><option value="F">Female</option></select>`)}
  ${L('Plan',h`<select value=${f.plan} onChange=${s('plan')}><option value="1">1 Month</option><option value="3">3 Months</option><option value="6">6 Months</option><option value="12">12 Months</option></select>`)}
  ${L('Start date',h`<input type="date" value=${f.start} onChange=${s('start')}/>`)}
  ${L('Total fee (₹)',h`<input type="number" value=${f.total} onChange=${s('total')}/>`)}
  ${L('Paid (₹)',h`<input type="number" value=${f.paid} onChange=${s('paid')}/>`)}
  <div className="col-span-2 text-sm bg-neutral-800 rounded-lg p-2">End date: <b>${fd(addM(f.start,f.plan))}</b> · Pending due: <b className="text-amber-400">${ru((+f.total||0)-(+f.paid||0))}</b></div>
  <${Btn} c="bg-orange-600 col-span-2" onClick=${()=>onSave(f)}>Save karein<//></div>
  ${f.id&&h`<div className="mt-4 border-t border-neutral-700 pt-3"><div className="flex gap-3 items-center"><${QR} v=${f.id} s=${96}/><div><div className="text-2xl font-extrabold">${f.id}</div><div className="text-xs text-neutral-400">Member QR badge (placeholder)</div></div></div>
   <div className="font-bold mt-3 mb-1">Body progress</div>${mine.map((p,i)=>h`<div key=${i} className="text-sm flex justify-between"><span>${fd(p.date)}</span><span>${p.wt} kg · BMI ${(p.wt/Math.pow(p.ht/100,2)).toFixed(1)}</span></div>`)}
   <div className="flex gap-2 mt-2"><input placeholder="Weight kg" type="number" value=${pf.wt} onChange=${e=>setPf({...pf,wt:e.target.value})}/><input placeholder="Height cm" type="number" value=${pf.ht} onChange=${e=>setPf({...pf,ht:e.target.value})}/><${Btn} c="bg-orange-600" onClick=${()=>{if(pf.wt&&pf.ht){setPr(a=>[...a,{mid:f.id,date:td,wt:+pf.wt,ht:+pf.ht}]);setPf({wt:'',ht:pf.ht})}}}>Log<//></div></div>`}<//>`}

function App(){
 const [role,setRole]=use('role','owner'),[gyms,setGyms]=use('gyms',G0),[gi,setGi]=use('gi',1),[ms,setMs]=use('ms',M0),[ls,setLs]=use('ls',L0),[cs,setCs]=use('cs',C0),[pr,setPr]=use('pr',PR0),[tab,setTab]=useState('dash'),[modal,setModal]=useState(null),[view,setView]=useState('landing');
 const g=gyms.find(x=>x.id===gi)||gyms[0],locked=g.susp||dl(g.exp)<0;
 if(view==='landing')return h`<${Landing} onDemo=${()=>setView('app')}/>`;
 return h`<div><header className="sticky top-0 z-40 bg-neutral-950/95 border-b border-neutral-800 p-3 flex items-center gap-2 flex-wrap"><div className="mr-auto flex items-baseline gap-2"><button onClick=${()=>setView('landing')} className="font-extrabold text-xl text-orange-500">GymPro</button><button className="text-xs text-neutral-400 underline" onClick=${()=>{try{Object.keys(localStorage).filter(k=>k.startsWith('gp_')).forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()}}>Reset demo</button></div>
  <div className="flex bg-neutral-800 rounded-lg p-1 text-sm">${[['admin','Super Admin'],['owner','Gym Owner']].map(([k,l])=>h`<button key=${k} onClick=${()=>setRole(k)} className=${'px-3 py-1 rounded-md '+(role===k?'bg-orange-600 font-bold':'')}>${l}</button>`)}</div>
  ${role==='owner'&&h`<select className="max-w-[170px]" value=${gi} onChange=${e=>{setGi(+e.target.value);setTab('dash')}} aria-label="Gym">${gyms.map(x=>h`<option key=${x.id} value=${x.id}>${x.name}</option>`)}</select>`}</header>
  ${role==='admin'?h`<${Admin} gyms=${gyms} setGyms=${setGyms}/>`:locked?h`<${Lock} g=${g}/>`:h`<${Owner} g=${g} ms=${ms} setMs=${setMs} ls=${ls} setLs=${setLs} cs=${cs} setCs=${setCs} pr=${pr} setPr=${setPr} tab=${tab} setTab=${setTab} modal=${modal} setModal=${setModal}/>`}</div>`}
ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
</script>
</body>
</html>
