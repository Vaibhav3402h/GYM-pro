 return h`<div><header className="sticky top-0 z-40 bg-neutral-950/95 border-b border-neutral-800 p-3 flex items-center gap-2"><div className="font-extrabold text-xl text-orange-500 mr-auto">GymPro${admin?' Admin':''}</div><span className="text-xs text-neutral-400 truncate max-w-[160px]">${sess.user.email}</span><${Btn} onClick=${()=>sb.auth.signOut()}>Logout<//></header>
